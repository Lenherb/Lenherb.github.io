<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoomDuck</title>
<meta name="description" content="DoomDuck – a pixel-art survivor game: one duck against the whole farm.">
<link rel="icon" href="../favicon.png">
<style>
  :root { --bg:#f4f1e8; --text:#1f2328; --muted:#5a616b; --accent:#c23b22; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --text:#e8e6e1; --muted:#a3a8b0; --accent:#ff7a5c; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; text-align:center; }
  img.icon { width:160px; height:160px; border-radius:32px; image-rendering:pixelated; }
  img.cover { width:100%; max-width:630px; border-radius:12px; margin-top:24px; image-rendering:pixelated; }
  h1 { font-size:2.2rem; margin:16px 0 4px; }
  p { color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <img class="icon" src="../favicon.png" alt="DoomDuck icon">
  <h1>DoomDuck</h1>
  <p>One duck. One pitchfork. The whole farm against you.<br>Survive ten minutes, beat the boss, and do it again on Hard.</p>
  <img class="cover" src="cover.png" alt="DoomDuck">
  <p><a href="privacy/">Privacy Policy</a> · <a href="mailto:CONTACT_EMAIL">Contact</a></p>
  <p>© 2026 Lenherb</p>
</main>
</body>
</html>
